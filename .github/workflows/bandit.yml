name: bandit

# Python security linter. Runs bandit directly rather than through a
# third-party action: the upstream template used shundor/python-bandit-scan,
# an individual's action, and SECURITY.md in this repository asks people to
# report credential exposure. Running unreviewed third-party code against the
# tree would sit badly with that. pip install and a command line do the same
# job with nothing in between.
#
# bandit is a CI dependency, not a tree dependency. The stdlib-only rule that
# tests.yml enforces is about what the harness imports, which is unaffected.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[sarif]

      # archive/ holds superseded tooling that is not maintained, so it is
      # excluded rather than producing findings nobody will act on.
      - name: Run bandit
        run: |
          bandit -r . \
            --exclude ./archive,./.git \
            --format sarif \
            --output bandit.sarif \
            --exit-zero

      - name: Upload results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit
