name: codeql

# Code scanning. Modest value on a stdlib-only tree with no untrusted input,
# but it is free, it runs on the schedule as well as on pull requests, and the
# one class it would genuinely catch here is a credential or evaluator field
# reaching somewhere it should not.
#
# Weekly rather than daily: the tree changes in bursts, and a daily run on a
# quiet repository is noise.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

# Least privilege at the top, widened per job only where a job needs more.
# Without this the workflow inherits the repository default, which can be
# write-all. Scorecard's Token-Permissions check flags exactly that.
permissions:
  contents: read

jobs:
  analyze:
    name: analyze python
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # security-and-quality adds maintainability queries on top of the
          # default security set. Worth it here: the tree is small enough that
          # the extra findings stay readable.
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v4
